<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel GPT Processor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Add Excel reading library -->
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-center text-gray-800">Excel GPT Processor</h1>
        
        <!-- Upload Form -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <form id="uploadForm" class="space-y-4">
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center">
                    <input type="file" id="fileInput" accept=".xlsx,.xls" class="hidden">
                    <label for="fileInput" class="cursor-pointer">
                        <div class="text-gray-600">
                            <p class="mb-2">Drop your Excel file here or click to upload</p>
                            <p class="text-sm text-gray-500">Supports .xlsx and .xls files</p>
                        </div>
                    </label>
                </div>
                <div class="space-y-2">
                    <input type="text" 
                           id="apiKey" 
                           placeholder="Enter your OpenAI API key" 
                           class="w-full p-2 border rounded-lg"
                           required>
                    <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition-colors">
                        Process File
                    </button>
                </div>
            </form>
        </div>

        <!-- Loading State -->
        <div id="loading" class="hidden">
            <div class="flex items-center justify-center space-x-2">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
                <p class="text-gray-600">Processing your file...</p>
            </div>
        </div>

        <!-- Results Section -->
        <div id="results" class="hidden space-y-4">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Results</h2>
            <div id="resultsContent" class="space-y-4"></div>
        </div>
    </div>

    <script>
        async function processWithGPT(text, apiKey) {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-3.5-turbo",
                    messages: [
                        {
                            role: "system",
                            content: "You are a helpful assistant processing Excel data."
                        },
                        {
                            role: "user",
                            content: `Please analyze this data: ${text}`
                        }
                    ]
                })
            });

            const data = await response.json();
            return data.choices[0].message.content;
        }

        async function processExcelFile(file, apiKey) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        
                        // Get first sheet
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        
                        // Convert to JSON
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                        
                        const results = [];
                        for (let [index, row] of jsonData.entries()) {
                            const rowText = Object.entries(row)
                                .map(([key, value]) => `${key}: ${value}`)
                                .join(" | ");
                            
                            const gptResponse = await processWithGPT(rowText, apiKey);
                            
                            results.push({
                                row_number: index + 1,
                                original_data: rowText,
                                gpt_response: gptResponse
                            });
                        }
                        
                        resolve(results);
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.onerror = error => reject(error);
                reader.readAsArrayBuffer(file);
            });
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            const apiKey = document.getElementById('apiKey').value.trim();
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file first.');
                return;
            }

            if (!apiKey) {
                alert('Please enter your OpenAI API key.');
                return;
            }

            // Show loading state
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');

            try {
                const results = await processExcelFile(file, apiKey);

                // Display results
                const resultsContent = document.getElementById('resultsContent');
                resultsContent.innerHTML = results.map(result => `
                    <div class="bg-white p-4 rounded-lg shadow-md">
                        <p class="font-semibold text-gray-700">Row ${result.row_number}</p>
                        <p class="text-sm text-gray-600 mt-2">${result.original_data}</p>
                        <div class="mt-2 p-3 bg-gray-50 rounded">
                            <p class="text-gray-800">${result.gpt_response}</p>
                        </div>
                    </div>
                `).join('');

                document.getElementById('results').classList.remove('hidden');
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        });

        // Handle drag and drop
        const dropZone = document.querySelector('.border-dashed');
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('border-blue-500');
        }

        function unhighlight(e) {
            dropZone.classList.remove('border-blue-500');
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            document.getElementById('fileInput').files = files;
        }
    </script>
</body>
</html>
